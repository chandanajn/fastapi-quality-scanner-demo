name: CI/CD Security and Code Quality Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-scan-and-quality:
    name: Build, Scan and Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarQube blame information

      # ----------------------------------------------------
      # 1. Setup Python
      # ----------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      # ----------------------------------------------------
      # 2. Install Dependencies
      # ----------------------------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # ----------------------------------------------------
      # 3. SonarQube Scan
      # ----------------------------------------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------
      # 4. Code Quality & Security Tools
      # ----------------------------------------------------
      - name: Run Flake8 (Syntax and Style Linter)
        run: python -m flake8 app tests --exit-zero

      - name: Run Pylint (Code Quality & PEP 8 Scorer)
        run: python -m pylint app tests --exit-zero

      - name: Run Mypy (Static Type Checker)
        run: python -m mypy app tests

      - name: Run Bandit (Security Vulnerability Scanner - SAST)
        run: python -m bandit -r app tests

      - name: Run detect-secrets (Secret & API Key Scanner)
        run: python -m detect_secrets scan app tests

      - name: Run pip-audit (Dependency Vulnerabilities)
        run: python -m pip_audit -r requirements.txt

      # ----------------------------------------------------
      # 5. Build Docker Image
      # ----------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build -t fastapi-app:latest .

      # ----------------------------------------------------
      # 6. Trivy Scanner (Image Mode)
      # ----------------------------------------------------
      - name: Run Trivy vulnerability scanner on Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'fastapi-app:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
